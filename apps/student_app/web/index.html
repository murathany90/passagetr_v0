<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PASSAGETR — İngilizce öğrenmenin en akıllı yolu. Okuma, kelime ve gramer modülleriyle İngilizceni geliştir.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F1117">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PASSAGETR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PASSAGETR</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background: #0F172A;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      background: #0F172A;
      transition: opacity 0.4s ease;
    }

    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #fff;
      margin-bottom: 40px;
    }

    .loading-title span {
      background: linear-gradient(135deg, #FF6A00, #FF9F43);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .pulse-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-ring {
      width: 60px;
      height: 60px;
      border: 3px solid #FF6A00;
      border-radius: 50%;
      position: absolute;
      animation: pulse-ring 1.5s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    .pulse-dot {
      width: 16px;
      height: 16px;
      background-color: #FF6A00;
      border-radius: 50%;
      position: relative;
      animation: pulse-dot 1.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) -0.4s infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.33); }
      80%, 100% { opacity: 0; }
    }

    @keyframes pulse-dot {
      0% { transform: scale(0.8); }
      50% { transform: scale(1); }
      100% { transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loading-title"><span>PASSAGETR</span></div>
    <div class="pulse-container">
      <div class="pulse-ring"></div>
      <div class="pulse-dot"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function () { loader.remove(); }, 400);
      }
    });
  </script>
</body>
</html>
