name: student_app
description: PASSAGETR v2 student application
publish_to: none
version: 2.0.13+13
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_tts: ^4.2.3
  flutter_widget_from_html_core: ^0.16.0
  go_router: ^16.2.1
  supabase_flutter: ^2.10.3
  url_launcher: ^6.3.2
  shared_core:
    path: ../../packages/shared_core
  shared_data:
    path: ../../packages/shared_data
  shared_domain:
    path: ../../packages/shared_domain
  shared_ui:
    path: ../../packages/shared_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/readings/
    - assets/db/dictionary_local.sqlite
