<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="admin_console">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PASSAGETR Admin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background: #0F172A;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      background: #0F172A;
      transition: opacity 0.4s ease;
    }

    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #94A3B8;
      margin-bottom: 30px;
    }

    .loading-title span {
      background: linear-gradient(135deg, #72A3FF, #3B82F6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .pulse {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #72A3FF;
      box-shadow: 0 0 0 0 rgba(114, 163, 255, 0.7);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(114, 163, 255, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 20px rgba(114, 163, 255, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(114, 163, 255, 0);
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loading-title"><span>PASSAGETR</span> ADMIN</div>
    <div class="pulse"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function () { loader.remove(); }, 400);
      }
    });
  </script>
</body>
</html>
