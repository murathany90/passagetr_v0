<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Premium Typing Practice</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#105944", // Dark Emerald Green from screenshots
                        "primary-dark": "#0a3d2e",
                        "primary-light": "#e6f0ed",
                        "background-light": "#f8faf9",
                        "background-dark": "#121212",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e1e1e",
                        "text-light": "#1f2937",
                        "text-dark": "#f3f4f6",
                        "subtext-light": "#6b7280",
                        "subtext-dark": "#9ca3af",
                        "border-light": "#d1d5db",
                        "border-dark": "#374151",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.75rem", // 12px for modern feel
                        "xl": "1rem",
                        "2xl": "1.5rem",
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(16, 89, 68, 0.1)',
                        'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.05)',
                    }
                },
            },
        };
    </script>
<style>body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex flex-col items-center justify-center p-4">
<div class="w-full max-w-md h-[800px] bg-background-light dark:bg-background-dark relative overflow-hidden flex flex-col shadow-2xl rounded-[3rem] border-8 border-gray-900 dark:border-gray-800">
<div class="h-12 w-full flex items-center justify-between px-6 pt-2 bg-background-light dark:bg-background-dark z-20">
<span class="text-sm font-semibold text-text-light dark:text-text-dark">01:00</span>
<div class="flex items-center gap-1.5">
<span class="material-icons-round text-sm text-text-light dark:text-text-dark">signal_cellular_alt</span>
<span class="material-icons-round text-sm text-text-light dark:text-text-dark">wifi</span>
<span class="material-icons-round text-sm text-text-light dark:text-text-dark">battery_full</span>
</div>
</div>
<div class="px-4 py-3 flex items-center gap-4 bg-background-light dark:bg-background-dark z-10 sticky top-0">
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-text-light dark:text-text-dark">
<span class="material-icons-round text-2xl">arrow_back</span>
</button>
<h1 class="text-xl font-bold text-text-light dark:text-text-dark tracking-tight">Typing 1/10</h1>
<div class="absolute bottom-0 left-0 w-full h-1 bg-gray-200 dark:bg-gray-800">
<div class="h-full bg-primary w-[10%] rounded-r-full transition-all duration-500"></div>
</div>
</div>
<div class="flex-1 overflow-y-auto px-6 py-8 flex flex-col">
<div class="bg-surface-light dark:bg-surface-dark rounded-2xl p-6 shadow-soft border border-gray-100 dark:border-gray-800 mb-8 transform transition-all duration-300 hover:scale-[1.01]">
<div class="flex items-center gap-2 mb-3">
<span class="px-2.5 py-1 rounded-md bg-primary-light dark:bg-primary/20 text-primary dark:text-primary-light text-xs font-bold uppercase tracking-wider">
                        TR Anlam
                    </span>
</div>
<p class="text-2xl md:text-3xl font-bold text-text-light dark:text-text-dark leading-tight">
                    kapatmak / yakın
                </p>
</div>
<div class="space-y-6 flex-1">
<div class="relative group">
<label class="block text-sm font-medium text-subtext-light dark:text-subtext-dark mb-2 pl-1" for="answer">
                        English Translation
                    </label>
<div class="relative">
<input autocomplete="off" class="block w-full px-5 py-4 text-lg rounded-xl border-gray-300 dark:border-gray-700 bg-white dark:bg-surface-dark text-text-light dark:text-text-dark shadow-sm focus:border-primary focus:ring-primary focus:ring-2 transition-all duration-200 placeholder:text-gray-400 dark:placeholder:text-gray-600" id="answer" name="answer" placeholder="English kelimeyi yaz" type="text"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
<span class="material-icons-round text-gray-400 dark:text-gray-600 group-focus-within:text-primary transition-colors">edit</span>
</div>
</div>
<p class="mt-2 text-xs text-subtext-light dark:text-subtext-dark pl-1">
                        Type the exact translation for the word above.
                    </p>
</div>
</div>
<div class="mt-auto mb-8 flex justify-center">
<button class="flex items-center gap-2 text-sm text-primary font-medium px-4 py-2 rounded-full hover:bg-primary-light dark:hover:bg-primary/10 transition-colors">
<span class="material-icons-round text-lg">lightbulb_outline</span>
                    Need a hint?
                </button>
</div>
<div class="mt-4">
<button class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-primary/30 transform active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 text-lg">
<span>Gonder</span>
<span class="material-icons-round text-xl">send</span>
</button>
</div>
</div>
<div class="h-6 w-full bg-background-light dark:bg-background-dark flex justify-center items-center pb-2">
<div class="w-1/3 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
</div>
</div>

</body></html>
