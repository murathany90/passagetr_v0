<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Interactive Flashcard Session</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#047857", // Dark Emerald Green (emerald-700)
              "primary-light": "#34D399", // emerald-400 for accents
              "primary-dark": "#064E3B", // emerald-900 for dark mode depths
              "background-light": "#F0FDF4", // emerald-50
              "background-dark": "#022C22", // emerald-950
              "surface-light": "#FFFFFF",
              "surface-dark": "#111827",
              "danger-light": "#FEE2E2", // red-100
              "danger-text": "#DC2626", // red-600
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Playfair Display", "serif"],
            },
            borderRadius: {
              DEFAULT: "1rem",
              "xl": "1.5rem",
              "2xl": "2rem",
              "3xl": "3rem",
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
              'glass-dark': '0 8px 32px 0 rgba(0, 0, 0, 0.3)',
            }
          },
        },
      };
    </script>
<style>.glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-panel {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card-main {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .dark .glass-card-main {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }.perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-sans antialiased text-gray-800 dark:text-gray-100 h-screen overflow-hidden flex flex-col transition-colors duration-300">
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-emerald-300/20 dark:bg-emerald-600/10 blur-[80px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] rounded-full bg-teal-200/20 dark:bg-teal-800/10 blur-[80px]"></div>
</div>
<header class="relative z-10 px-6 pt-12 pb-4 flex items-center justify-between">
<button class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-icons-round text-2xl text-gray-700 dark:text-gray-200">arrow_back</span>
</button>
<h1 class="text-lg font-semibold tracking-wide text-gray-800 dark:text-gray-100">YDS Set 001</h1>
<button class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-icons-round text-2xl text-gray-700 dark:text-gray-200">more_vert</span>
</button>
</header>
<div class="relative z-10 px-8 py-2">
<div class="flex justify-between items-end mb-2">
<span class="text-sm font-medium text-gray-500 dark:text-gray-400">Progress</span>
<span class="text-lg font-bold text-primary dark:text-emerald-400">4<span class="text-sm font-normal text-gray-400 dark:text-gray-500">/20</span></span>
</div>
<div class="h-2 w-full bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 20%"></div>
</div>
</div>
<main class="relative z-10 flex-1 flex flex-col justify-center items-center px-6 py-4 perspective-1000">
<div class="relative w-full max-w-sm aspect-[3/4] group cursor-pointer">
<div class="relative w-full h-full transform-style-3d transition-all duration-500">
<div class="absolute inset-0 w-full h-full glass-card-main shadow-glass dark:shadow-glass-dark rounded-3xl flex flex-col items-center justify-center p-8 text-center border-t border-white/50 dark:border-white/10">
<button class="absolute top-6 right-6 p-3 rounded-full bg-emerald-50 dark:bg-emerald-900/30 text-primary dark:text-emerald-400 hover:scale-110 transition-transform">
<span class="material-icons-round text-2xl">volume_up</span>
</button>
<span class="px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase bg-gray-100 dark:bg-gray-700/50 text-gray-500 dark:text-gray-400 mb-6">
                        Verb
                    </span>
<h2 class="text-5xl font-display font-bold text-gray-900 dark:text-white mb-8 tracking-tight drop-shadow-sm">
                        abandon
                    </h2>
<div class="w-full space-y-4 opacity-80">
<p class="text-sm text-gray-500 dark:text-gray-400 font-medium italic">
                            "The captain gave the order to abandon ship."
                        </p>
</div>
<div class="absolute bottom-6 flex items-center gap-2 text-gray-400 dark:text-gray-500 text-sm animate-pulse">
<span class="material-icons-round text-base">touch_app</span>
<span>Tap to flip</span>
</div>
</div>
<div class="absolute -inset-4 bg-gradient-to-tr from-emerald-200 to-teal-200 dark:from-emerald-900 dark:to-teal-900 rounded-3xl opacity-20 blur-xl -z-10 transform translate-y-4"></div>
</div>
</div>
</main>
<footer class="relative z-10 px-6 pb-10 pt-4">
<div class="flex gap-4 max-w-sm mx-auto">
<button class="flex-1 h-16 rounded-2xl flex items-center justify-center gap-2 font-semibold text-lg transition-all active:scale-95 bg-danger-light text-danger-text dark:bg-red-900/30 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/50 border border-transparent dark:border-red-800/30 shadow-sm">
<span class="material-icons-round">close</span>
                Bilemedim
            </button>
<button class="flex-1 h-16 rounded-2xl flex items-center justify-center gap-2 font-semibold text-lg transition-all active:scale-95 bg-primary text-white shadow-lg shadow-emerald-500/30 hover:bg-emerald-800 hover:shadow-emerald-600/40">
<span class="material-icons-round">check</span>
                Bildim
            </button>
</div>
<div class="mt-6 flex justify-center gap-8 text-gray-400 dark:text-gray-500">
<button class="flex flex-col items-center gap-1 text-xs font-medium hover:text-primary dark:hover:text-emerald-400 transition-colors">
<span class="material-icons-round text-xl">bookmark_border</span>
                Save
            </button>
<button class="flex flex-col items-center gap-1 text-xs font-medium hover:text-primary dark:hover:text-emerald-400 transition-colors">
<span class="material-icons-round text-xl">edit</span>
                Edit
            </button>
<button class="flex flex-col items-center gap-1 text-xs font-medium hover:text-primary dark:hover:text-emerald-400 transition-colors">
<span class="material-icons-round text-xl">flag</span>
                Report
            </button>
</div>
</footer>
<button class="fixed top-12 right-6 w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-800 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity z-50" onclick="document.documentElement.classList.toggle('dark')" title="Toggle Theme">
<span class="material-icons-round text-gray-800 dark:text-gray-200">brightness_6</span>
</button>

</body></html>
