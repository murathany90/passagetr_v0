<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dark Mode Flashcard Session</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0c6e51",
              "background-light": "#f6f8f7",
              "background-dark": "#11211c",
              "surface-dark": "#1a2c26",
              "surface-card": "#1E1E1E",
            },
            fontFamily: {
              "display": ["Lexend", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            boxShadow: {
                "glow": "0 0 15px -3px rgba(12, 110, 81, 0.3)",
                "glow-hover": "0 0 20px -3px rgba(12, 110, 81, 0.5)"
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 flex justify-center min-h-screen">
<div class="relative flex h-full min-h-screen w-full max-w-md flex-col overflow-x-hidden bg-background-light dark:bg-background-dark shadow-2xl">
<!-- Header -->
<div class="flex items-center justify-between p-4 pt-6 bg-transparent z-10">
<button class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-surface-dark transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Flashcard Session</h2>
<div class="flex items-center justify-end w-10">
<button class="flex items-center justify-center rounded-full text-slate-900 dark:text-slate-100 hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">more_vert</span>
</button>
</div>
</div>
<!-- Progress Bar -->
<div class="flex flex-col gap-2 px-6 pt-2 pb-4">
<div class="flex justify-between items-end">
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium">Daily Goal</p>
<p class="text-primary font-bold text-sm">18/40</p>
</div>
<div class="rounded-full bg-slate-200 dark:bg-surface-dark h-2 overflow-hidden">
<div class="h-full rounded-full bg-primary transition-all duration-500 ease-out" style="width: 45%;"></div>
</div>
</div>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col items-center justify-center p-6 w-full max-w-md mx-auto relative z-0">
<!-- Flashcard -->
<div class="relative w-full aspect-[4/5] bg-white dark:bg-surface-card rounded-xl border border-slate-200 dark:border-primary/30 shadow-glow flex flex-col items-center justify-between p-8 overflow-hidden group">
<!-- Background decorative elements -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-24 h-24 bg-primary/5 rounded-full blur-2xl translate-y-1/2 -translate-x-1/2 pointer-events-none"></div>
<div class="w-full flex justify-between items-start z-10">
<div class="flex gap-2">
<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-primary/20 text-primary border border-primary/20">
                            adj
                        </span>
<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-slate-100 dark:bg-surface-dark text-slate-500 dark:text-slate-400">
                           Level B2
                        </span>
</div>
<button class="text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">volume_up</span>
</button>
</div>
<div class="flex flex-col items-center justify-center text-center gap-4 z-10 my-auto">
<h1 class="text-4xl md:text-5xl font-serif font-bold text-slate-900 dark:text-white tracking-tight">consistent</h1>
<p class="text-slate-400 dark:text-slate-500 text-lg font-mono">/kənˈsɪstənt/</p>
</div>
<div class="w-full z-10">
<button class="w-full py-4 text-center text-slate-500 dark:text-slate-400 text-sm font-medium hover:text-primary transition-colors flex flex-col items-center gap-2 group-hover:text-primary">
<span class="text-xs uppercase tracking-widest opacity-60">Tap to flip</span>
<span class="material-symbols-outlined animate-bounce">keyboard_arrow_down</span>
</button>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="px-6 pb-8 pt-2 w-full">
<div class="grid grid-cols-3 gap-4">
<!-- Button: Bilmiyordum (Red) -->
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-lg bg-surface-dark border border-red-500/20 active:scale-95 transition-all hover:bg-red-500/10 hover:border-red-500/50 group">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-red-500/10 text-red-500 group-hover:bg-red-500 group-hover:text-white transition-colors">
<span class="material-symbols-outlined">close</span>
</div>
<span class="text-xs font-medium text-red-400 group-hover:text-red-300">Hard</span>
</button>
<!-- Button: Kararsızım (Orange) -->
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-lg bg-surface-dark border border-orange-500/20 active:scale-95 transition-all hover:bg-orange-500/10 hover:border-orange-500/50 group">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-orange-500/10 text-orange-500 group-hover:bg-orange-500 group-hover:text-white transition-colors">
<span class="material-symbols-outlined">question_mark</span>
</div>
<span class="text-xs font-medium text-orange-400 group-hover:text-orange-300">Doubt</span>
</button>
<!-- Button: Biliyordum (Green) -->
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-lg bg-surface-dark border border-primary/20 active:scale-95 transition-all hover:bg-primary/10 hover:border-primary/50 group">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined">check</span>
</div>
<span class="text-xs font-medium text-primary group-hover:text-emerald-300">Easy</span>
</button>
</div>
</div>
<!-- Bottom Navigation -->
<div class="flex gap-2 border-t border-slate-200 dark:border-surface-dark bg-white dark:bg-background-dark px-4 pb-6 pt-2">
<a class="flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-primary" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined fill-current" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Learn</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">history</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Review</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">bar_chart</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Stats</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">person</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Profile</p>
</a>
</div>
</div>
</body></html>
