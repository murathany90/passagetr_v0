<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Premium Flashcard Interface</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#0C6D4F", // Dark Emerald Green
              "primary-light": "#158c67",
              "primary-dark": "#074532",
              "background-light": "#F5FAF8", // Very light minty white
              "background-dark": "#0a1f18", // Very dark green/black
              "card-light": "#ffffff",
              "card-dark": "#132a22",
              "text-main-light": "#1f2937",
              "text-main-dark": "#f3f4f6",
              "text-sub-light": "#6b7280",
              "text-sub-dark": "#9ca3af",
            },
            fontFamily: {
              display: ["Merriweather", "serif"],
              sans: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.75rem",
              'xl': '1rem',
              '2xl': '1.5rem',
              '3xl': '2rem',
            },
            boxShadow: {
                'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                'glow': '0 0 20px rgba(12, 109, 79, 0.3)',
            }
          },
        },
      };
    </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Merriweather:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-sans h-screen flex flex-col overflow-hidden text-text-main-light dark:text-text-main-dark selection:bg-primary selection:text-white transition-colors duration-300">
<header class="flex items-center justify-between px-6 py-4 pt-12 relative z-10">
<button class="p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-colors text-text-main-light dark:text-text-main-dark">
<span class="material-icons-round text-2xl">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="text-sm font-medium tracking-wide text-text-sub-light dark:text-text-sub-dark uppercase">Hızlı Başla</h1>
<span class="font-bold text-lg text-primary dark:text-emerald-400">1<span class="text-gray-400 dark:text-gray-600 mx-1">/</span>10</span>
</div>
<button class="p-2 -mr-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-colors text-text-main-light dark:text-text-main-dark">
<span class="material-icons-round text-2xl">more_vert</span>
</button>
</header>
<div class="w-full px-6 mb-4">
<div class="h-1.5 w-full bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
<div class="h-full bg-primary w-[10%] rounded-full shadow-glow"></div>
</div>
</div>
<main class="flex-1 flex flex-col justify-center items-center px-6 pb-6 perspective-1000 relative">
<div class="absolute top-1/4 -left-10 w-64 h-64 bg-primary/10 dark:bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-1/4 -right-10 w-64 h-64 bg-emerald-300/20 dark:bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="w-full h-full max-h-[500px] bg-card-light dark:bg-card-dark rounded-3xl shadow-soft dark:shadow-none border border-gray-100 dark:border-white/5 flex flex-col items-center justify-center relative overflow-hidden group transition-all duration-300 transform hover:scale-[1.01] cursor-pointer">
<div class="flex flex-col items-center z-10 p-8 text-center space-y-8">
<div class="space-y-4">
<h2 class="text-5xl font-display font-bold text-gray-900 dark:text-white tracking-tight">
                        ability
                    </h2>
<div class="inline-flex items-center justify-center px-4 py-1.5 rounded-full bg-gray-100 dark:bg-white/10 border border-gray-200 dark:border-white/5">
<span class="text-sm font-medium text-gray-600 dark:text-gray-300 italic">noun</span>
</div>
</div>
<button class="p-3 rounded-full bg-primary/10 hover:bg-primary/20 text-primary dark:text-emerald-400 transition-colors">
<span class="material-icons-round text-2xl">volume_up</span>
</button>
</div>
<div class="absolute bottom-8 w-full text-center px-6">
<p class="text-sm text-text-sub-light dark:text-text-sub-dark flex items-center justify-center gap-2 animate-pulse">
<span class="material-icons-round text-base">touch_app</span>
                    Detayları görmek için karta dokun
                 </p>
</div>
<div class="absolute inset-0 opacity-[0.03] dark:opacity-[0.05] pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
</div>
</main>
<footer class="px-6 pb-8 pt-2">
<div class="flex flex-col gap-3 w-full max-w-md mx-auto">
<button class="w-full py-4 px-6 bg-primary hover:bg-primary-dark active:bg-primary-dark text-white rounded-2xl shadow-lg shadow-primary/20 flex items-center justify-between group transition-all duration-200 transform active:scale-[0.98]">
<span class="font-semibold text-lg">Biliyordum</span>
<span class="bg-white/20 p-1 rounded-full group-hover:bg-white/30 transition-colors">
<span class="material-icons-round text-xl">check</span>
</span>
</button>
<button class="w-full py-4 px-6 bg-white dark:bg-card-dark border-2 border-gray-200 dark:border-white/10 hover:border-gray-300 dark:hover:border-white/20 text-gray-700 dark:text-gray-200 rounded-2xl flex items-center justify-between group transition-all duration-200 transform active:scale-[0.98]">
<span class="font-semibold text-lg">Kararsızım</span>
<span class="bg-gray-100 dark:bg-white/10 p-1 rounded-full text-gray-500 dark:text-gray-400 group-hover:bg-gray-200 dark:group-hover:bg-white/20 transition-colors">
<span class="material-icons-round text-xl">remove</span>
</span>
</button>
<button class="w-full py-4 px-6 bg-emerald-50 dark:bg-emerald-900/20 hover:bg-emerald-100 dark:hover:bg-emerald-900/30 text-primary dark:text-emerald-400 rounded-2xl flex items-center justify-between group transition-all duration-200 transform active:scale-[0.98]">
<span class="font-semibold text-lg">Bilmiyordum</span>
<span class="bg-emerald-100 dark:bg-emerald-800/40 p-1 rounded-full text-primary dark:text-emerald-400 group-hover:bg-emerald-200 dark:group-hover:bg-emerald-800/60 transition-colors">
<span class="material-icons-round text-xl">close</span>
</span>
</button>
</div>
</footer>

</body></html>
