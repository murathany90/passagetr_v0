<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Interactive Vocabulary Matching</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#105944", // Dark Emerald Green from screenshots
                        "primary-hover": "#0c4534",
                        "primary-light": "#d1e7dd", 
                        "background-light": "#F8FAFC", // Cool gray/white
                        "background-dark": "#121212", // Deep dark gray
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1E1E1E",
                        "text-main-light": "#1F2937",
                        "text-main-dark": "#E5E7EB",
                        "text-sub-light": "#6B7280",
                        "text-sub-dark": "#9CA3AF",
                        "border-light": "#E5E7EB",
                        "border-dark": "#374151",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "12px",
                        "xl": "16px",
                        "2xl": "24px",
                    },
                    boxShadow: {
                        'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                        'glow': '0 0 15px rgba(16, 89, 68, 0.15)',
                    }
                },
            },
        };
    </script>
<style>.selected-card {
            border-color: #105944 !important;
            background-color: #F0FDF4 !important;
            box-shadow: 0 0 0 2px #105944 !important;
        }
        .dark .selected-card {
            background-color: #062C21 !important;}
        .matched-card {
            opacity: 0.5;
            pointer-events: none;
            background-color: #DCFCE7 !important;
            border-color: transparent !important;
        }
        .dark .matched-card {
            background-color: #064E3B !important;
        }
        @keyframes pulse-success {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .animate-pulse-success {
            animation: pulse-success 0.3s ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main-light dark:text-text-main-dark antialiased transition-colors duration-300 min-h-screen flex flex-col">
<header class="sticky top-0 z-50 bg-surface-light/90 dark:bg-surface-dark/90 backdrop-blur-md border-b border-border-light dark:border-border-dark px-4 py-3 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-3">
<button class="p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-text-main-light dark:text-text-main-dark transition-colors">
<span class="material-icons-round text-2xl">arrow_back</span>
</button>
<div>
<h1 class="text-lg font-bold leading-tight">Matching</h1>
<p class="text-xs text-text-sub-light dark:text-text-sub-dark font-medium">Step 1 of 10</p>
</div>
</div>
<div class="flex flex-col items-end w-24">
<div class="flex items-center gap-1 text-sm font-semibold text-primary dark:text-emerald-400">
<span>0</span>
<span class="text-text-sub-light dark:text-text-sub-dark font-normal">/ 10</span>
</div>
<div class="w-full h-1.5 bg-gray-200 dark:bg-gray-700 rounded-full mt-1 overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 10%"></div>
</div>
</div>
</header>
<main class="flex-1 p-4 pb-24 max-w-md mx-auto w-full">
<div class="bg-primary/10 dark:bg-primary/20 rounded-xl p-4 mb-6 flex items-start gap-3 border border-primary/20">
<span class="material-icons-round text-primary dark:text-emerald-400 mt-0.5">lightbulb</span>
<div class="text-sm">
<p class="font-semibold text-primary dark:text-emerald-400">How to play</p>
<p class="text-text-sub-light dark:text-text-sub-dark leading-snug mt-1">Tap an English word, then find its Turkish match to clear the pair.</p>
</div>
</div>
<div class="grid grid-cols-2 gap-x-4 gap-y-3">
<div class="flex flex-col gap-3">
<button class="group relative w-full bg-surface-light dark:bg-surface-dark p-4 rounded-xl border-2 border-primary shadow-glow transition-all duration-200 flex flex-col items-start text-left">
<span class="text-base font-bold text-primary dark:text-emerald-400">approve</span>
<span class="text-[10px] uppercase tracking-wider font-semibold text-text-sub-light dark:text-text-sub-dark mt-1 bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">verb</span>
<div class="absolute top-2 right-2 w-2 h-2 rounded-full bg-primary animate-pulse"></div>
</button>
<button class="w-full bg-surface-light dark:bg-surface-dark p-4 rounded-xl border border-border-light dark:border-border-dark shadow-soft hover:border-primary/50 dark:hover:border-primary/50 transition-all duration-200 flex flex-col items-start text-left active:scale-[0.98]">
<span class="text-base font-semibold">annoy</span>
<span class="text-[10px] uppercase tracking-wider font-semibold text-text-sub-light dark:text-text-sub-dark mt-1 bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">verb</span>
</button>
<button class="w-full bg-green-50 dark:bg-green-900/20 p-4 rounded-xl border border-transparent shadow-none transition-all duration-200 flex flex-col items-start text-left opacity-60">
<div class="flex items-center justify-between w-full">
<span class="text-base font-semibold text-green-700 dark:text-green-400 line-through">clean</span>
<span class="material-icons-round text-sm text-green-600 dark:text-green-400">check_circle</span>
</div>
<span class="text-[10px] uppercase tracking-wider font-semibold text-green-600/70 dark:text-green-400/70 mt-1 px-1.5 py-0.5 rounded">adj</span>
</button>
<button class="w-full bg-surface-light dark:bg-surface-dark p-4 rounded-xl border border-border-light dark:border-border-dark shadow-soft hover:border-primary/50 dark:hover:border-primary/50 transition-all duration-200 flex flex-col items-start text-left active:scale-[0.98]">
<span class="text-base font-semibold">chill</span>
<span class="text-[10px] uppercase tracking-wider font-semibold text-text-sub-light dark:text-text-sub-dark mt-1 bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">noun</span>
</button>
<button class="w-full bg-surface-light dark:bg-surface-dark p-4 rounded-xl border border-border-light dark:border-border-dark shadow-soft hover:border-primary/50 dark:hover:border-primary/50 transition-all duration-200 flex flex-col items-start text-left active:scale-[0.98]">
<span class="text-base font-semibold">attack</span>
<span class="text-[10px] uppercase tracking-wider font-semibold text-text-sub-light dark:text-text-sub-dark mt-1 bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">verb</span>
</button>
</div>
<div class="flex flex-col gap-3">
<button class="h-full w-full bg-surface-light dark:bg-surface-dark p-4 rounded-xl border border-border-light dark:border-border-dark shadow-soft hover:border-primary/50 dark:hover:border-primary/50 transition-all duration-200 flex items-center justify-center text-center active:scale-[0.98]">
<span class="text-sm font-medium">onaylamak</span>
</button>
<button class="h-full w-full bg-green-50 dark:bg-green-900/20 p-4 rounded-xl border border-transparent shadow-none transition-all duration-200 flex items-center justify-center text-center opacity-60">
<span class="text-sm font-medium text-green-700 dark:text-green-400 line-through">temiz</span>
</button>
<button class="h-full w-full bg-surface-light dark:bg-surface-dark p-4 rounded-xl border border-border-light dark:border-border-dark shadow-soft hover:border-primary/50 dark:hover:border-primary/50 transition-all duration-200 flex items-center justify-center text-center active:scale-[0.98]">
<span class="text-sm font-medium">kızdırmak</span>
</button>
<button class="h-full w-full bg-surface-light dark:bg-surface-dark p-4 rounded-xl border border-border-light dark:border-border-dark shadow-soft hover:border-primary/50 dark:hover:border-primary/50 transition-all duration-200 flex items-center justify-center text-center active:scale-[0.98]">
<span class="text-sm font-medium">saldırmak</span>
</button>
<button class="h-full w-full bg-surface-light dark:bg-surface-dark p-4 rounded-xl border border-border-light dark:border-border-dark shadow-soft hover:border-primary/50 dark:hover:border-primary/50 transition-all duration-200 flex items-center justify-center text-center active:scale-[0.98]">
<span class="text-sm font-medium">üşüme</span>
</button>
</div>
</div>
</main>
<div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark pointer-events-none">
<div class="max-w-md mx-auto pointer-events-auto flex items-center justify-between gap-4">
<button class="flex-1 bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark text-text-sub-light dark:text-text-sub-dark font-semibold py-3.5 px-6 rounded-2xl shadow-sm active:scale-95 transition-transform flex items-center justify-center gap-2">
<span class="material-icons-round text-xl">restart_alt</span>
                Reset
            </button>
<button class="flex-1 bg-primary text-white font-semibold py-3.5 px-6 rounded-2xl shadow-lg shadow-primary/30 hover:bg-primary-hover active:scale-95 transition-all flex items-center justify-center gap-2">
<span>Check</span>
<span class="material-icons-round text-xl">check</span>
</button>
</div>
</div>

</body></html>
