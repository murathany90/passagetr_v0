<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Modern Multiple Choice Quiz</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Merriweather:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              // Dark Emerald Green Theme
              primary: "#065f46", // emerald-800
              "primary-hover": "#047857", // emerald-700
              "primary-light": "#d1fae5", // emerald-100
              "primary-dark-text": "#ecfdf5", // emerald-50
              "background-light": "#f8fafc", // slate-50
              "surface-light": "#ffffff",
              "text-light": "#0f172a", // slate-900
              "text-muted-light": "#64748b", // slate-500
              "background-dark": "#0f172a", // slate-900
              "surface-dark": "#1e293b", // slate-800
              "text-dark": "#f1f5f9", // slate-100
              "text-muted-dark": "#94a3b8", // slate-400
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Merriweather", "serif"],
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.75rem", // 12px for MD3 feel
              'xl': '1rem',
              '2xl': '1.5rem',
              'full': '9999px',
            },
            boxShadow: {
                'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)',
            }
          },
        },
      };
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center font-sans transition-colors duration-300 antialiased selection:bg-primary selection:text-white">
<div class="w-full max-w-md h-full min-h-screen relative flex flex-col bg-background-light dark:bg-background-dark">
<header class="px-6 pt-12 pb-4 flex items-center justify-between z-10">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full text-text-light dark:text-text-dark hover:bg-gray-100 dark:hover:bg-surface-dark transition-colors">
<span class="material-icons-round text-2xl">arrow_back</span>
</button>
<div class="flex-1 mx-4">
<div class="flex justify-between text-xs font-semibold tracking-wide text-text-muted-light dark:text-text-muted-dark mb-2">
<span>Question 1/10</span>
<span>10%</span>
</div>
<div class="h-2 w-full bg-gray-200 dark:bg-surface-dark rounded-full overflow-hidden">
<div class="h-full bg-primary w-[10%] rounded-full transition-all duration-500 ease-out"></div>
</div>
</div>
<button aria-label="Menu" class="p-2 -mr-2 rounded-full text-text-light dark:text-text-dark hover:bg-gray-100 dark:hover:bg-surface-dark transition-colors">
<span class="material-icons-round text-2xl">more_vert</span>
</button>
</header>
<main class="flex-1 px-6 flex flex-col justify-center items-center pb-20">
<div class="w-full mb-12 flex flex-col items-center">
<div class="mb-6">
<span class="px-4 py-1.5 rounded-full bg-primary-light text-primary text-sm font-semibold uppercase tracking-wider dark:bg-opacity-10 dark:text-emerald-400 border border-primary/10 dark:border-primary/20">
                        adjective
                    </span>
</div>
<h1 class="text-5xl font-serif font-bold text-text-light dark:text-text-dark mb-4 text-center tracking-tight">
                    broken
                </h1>
<button class="flex items-center space-x-2 text-text-muted-light dark:text-text-muted-dark hover:text-primary dark:hover:text-emerald-400 transition-colors">
<span class="material-icons-round text-xl">volume_up</span>
<span class="font-medium">/ˈbroʊ.kən/</span>
</button>
</div>
<div class="w-full space-y-4">
<button class="group w-full relative bg-surface-light dark:bg-surface-dark border-2 border-gray-200 dark:border-gray-700 hover:border-primary dark:hover:border-emerald-500 rounded-2xl p-4 flex items-center justify-center transition-all duration-200 active:scale-[0.98] shadow-card hover:shadow-soft">
<span class="text-lg font-medium text-text-light dark:text-text-dark group-hover:text-primary dark:group-hover:text-emerald-400">
                        açık / görünen
                    </span>
</button>
<button class="group w-full relative bg-primary dark:bg-primary border-2 border-primary rounded-2xl p-4 flex items-center justify-center transition-all duration-200 shadow-lg shadow-primary/20">
<span class="absolute left-4 w-6 h-6 rounded-full bg-white/20 flex items-center justify-center text-white">
<span class="material-icons-round text-sm">check</span>
</span>
<span class="text-lg font-semibold text-white">
                        kırık
                    </span>
</button>
<button class="group w-full relative bg-surface-light dark:bg-surface-dark border-2 border-gray-200 dark:border-gray-700 hover:border-primary dark:hover:border-emerald-500 rounded-2xl p-4 flex items-center justify-center transition-all duration-200 active:scale-[0.98] shadow-card hover:shadow-soft">
<span class="text-lg font-medium text-text-light dark:text-text-dark group-hover:text-primary dark:group-hover:text-emerald-400">
                        endişeli
                    </span>
</button>
<button class="group w-full relative bg-surface-light dark:bg-surface-dark border-2 border-gray-200 dark:border-gray-700 hover:border-primary dark:hover:border-emerald-500 rounded-2xl p-4 flex items-center justify-center transition-all duration-200 active:scale-[0.98] shadow-card hover:shadow-soft">
<span class="text-lg font-medium text-text-light dark:text-text-dark group-hover:text-primary dark:group-hover:text-emerald-400">
                        meşgul
                    </span>
</button>
</div>
</main>
<div class="px-6 pb-8 pt-4 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark sticky bottom-0 z-20">
<button class="w-full bg-primary text-white font-bold text-lg py-4 rounded-full shadow-lg shadow-primary/30 hover:shadow-primary/50 hover:bg-primary-hover active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
<span>Check Answer</span>
<span class="material-icons-round">arrow_forward</span>
</button>
</div>
</div>
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden opacity-40 dark:opacity-20">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary rounded-full blur-3xl opacity-20"></div>
<div class="absolute top-1/2 -left-24 w-72 h-72 bg-emerald-300 rounded-full blur-3xl opacity-20 dark:opacity-10"></div>
</div>

</body></html>
